name: docker-github-runner.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'postgres/**'
      - '.github/workflows/docker-github-runner.yaml'
  workflow_dispatch:

jobs:
  docker_build:
    uses: petrochenkov-ak-lab/.github/.github/workflows/docker-build.yml@main
    with:
      image_name: 'github-runner'
      image_tag: 'latest'
      dockerfile: './github-runner/Dockerfile'
