name: docker-postgres-exporter.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'postgres-exporter/**'
      - '.github/workflows/docker-postgres-exporter.yaml'
  workflow_dispatch:

jobs:
  docker_build:
    uses: ./.github/workflows/docker-build.yml@main
    with:
      image_name: 'postgres-exporter'
      image_tag: 'v0.18.0'
      dockerfile: './postgres-exporter/Dockerfile'

