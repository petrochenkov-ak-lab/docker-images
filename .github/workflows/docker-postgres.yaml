name: docker-postgres.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'postgres/**'
      - '.github/workflows/docker-postgres.yaml'
  workflow_dispatch:

jobs:
  docker_build:
    uses: petrochenkov-ak-lab/.github/.github/workflows/docker-build.yml
    with:
      image_name: 'postgres'
      image_tag: '18'
      dockerfile: './postgres/Dockerfile'

