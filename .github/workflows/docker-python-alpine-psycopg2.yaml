name: docker-python-alpine-psycopg2.yaml

on:
  push:
    branches: [ main ]
    paths:
      - 'postgres/**'
      - '.github/workflows/docker-python-alpine-psycopg2.yaml'
  workflow_dispatch:

jobs:
  docker_build:
    uses: petrochenkov-ak-lab/.github/.github/workflows/docker-build.yml@main
    with:
      image_name: 'python-alpine-psycopg2'
      image_tag: '3.14'
      dockerfile: './python-alpine-psycopg2/Dockerfile'
